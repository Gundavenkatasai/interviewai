version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: interviewai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: saig55728/interview:latest
    container_name: interviewai-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=development
      - PORT=8001
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=applyhustle
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ./apps/api-node:/app
      - /app/node_modules
    depends_on:
      - mongo

  web:
    build: ./apps/web
    container_name: interviewai-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

  jobspy-sidecar:
    build: ./services/jobspy-sidecar
    container_name: interviewai-jobspy
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  mongo_data:
